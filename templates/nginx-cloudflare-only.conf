# Managed by ubuntu-bun-server-setup. Re-runs keep this file.
# Answers 403 to any request that does not come through Cloudflare (needs
# conf.d/bun-cloudflare.conf). Enable by uncommenting
# "include snippets/cloudflare-only.conf;" in a server block.
# Gotcha: this also locks out direct and IP-address access, including
# health checks that bypass Cloudflare.
if ($bun_cloudflare_edge = 0) {
  return 403;
}
