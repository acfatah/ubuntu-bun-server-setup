# Managed by ubuntu-bun-server-setup. Re-runs keep this file while this line stays.
# Serves static files from __NGINX_ROOT__ and hands everything else to Bun
# via snippets/bun-proxy.conf (needs conf.d/bun-connection-upgrade.conf).

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  server_name _;

  root __NGINX_ROOT__;
  index index.html;

  server_tokens off;
  client_max_body_size 10m;

  # Inherited by every location below that has no add_header of its own
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  # Enable only after certbot has set up HTTPS for every name served here
  #add_header Strict-Transport-Security "max-age=31536000" always;

  # Cloudflare only: 403 for requests that bypass Cloudflare (see README)
  #include snippets/cloudflare-only.conf;

  # Static file if present, else the Bun app (single-page apps, server routes)
  location / {
    try_files $uri $uri/ @bun;
  }

  location @bun {
    include snippets/bun-proxy.conf;
  }

  # Health probe for monitors; see README "Health check"
  location = /healthz {
    access_log off;
    include snippets/bun-proxy.conf;
  }

  # API calls go straight to Bun with the full URI: /api/x arrives as /api/x
  location ^~ /api/ {
    include snippets/bun-proxy.conf;
  }

  # expires alone sets one Cache-Control; an add_header here would drop the
  # server-level security headers
  location ^~ /assets/ {
    gzip_static on;
    expires 12h;
  }
}
