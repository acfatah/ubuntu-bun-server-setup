# Managed by ubuntu-bun-server-setup: proxy settings for the Bun app,
# included by the default site. Re-runs keep this file.
# A PORT change in /etc/bun-app.env must be mirrored in proxy_pass below.

proxy_http_version 1.1;
# "upgrade" only when the client asked for one (map in conf.d)
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $bun_connection_upgrade;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

proxy_connect_timeout 5s;
# Long-lived WebSockets would otherwise drop after 60s idle
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# No URI part: the request path is passed on unchanged
proxy_pass http://127.0.0.1:3000;
