# Managed by ubuntu-bun-server-setup. Re-runs keep this file.
# Cloudflare support for every site (http context). Both includes are
# generated by cloudflare-update-ips (daily timer); this file needs them.
#
# Real client IP: requests from Cloudflare's ranges get $remote_addr from
# CF-Connecting-IP. Others are untouched, so a host not behind Cloudflare
# sees no change.
include /etc/nginx/cloudflare/real-ip.conf;

# 1 when the connection comes from a Cloudflare edge. $realip_remote_addr
# is the peer address before the real-IP swap. Used by
# snippets/cloudflare-only.conf.
geo $realip_remote_addr $bun_cloudflare_edge {
  default 0;
  include /etc/nginx/cloudflare/edge-ips.conf;
}

# 1 when snippets/cloudflare-only.conf should answer 403: not from an edge,
# except /healthz from the host itself (exact keys win over the regex).
map "$bun_cloudflare_edge:$realip_remote_addr:$uri" $bun_cloudflare_deny {
  default 0;
  "~^0:" 1;
  "0:127.0.0.1:/healthz" 0;
  "0:::1:/healthz" 0;
}
