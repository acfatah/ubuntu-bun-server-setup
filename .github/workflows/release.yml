name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure tag is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main || { echo "Tag must point to main"; exit 1; }

      - name: Ensure VERSION matches the tag
        run: |
          version=$(cat VERSION)
          [[ $version == "${GITHUB_REF_NAME#v}" ]] || { echo "VERSION ($version) does not match tag $GITHUB_REF_NAME"; exit 1; }

      # Before the release exists, so a failed build publishes nothing
      - name: Build pinned installer
        run: ./build-installer.sh "${GITHUB_REF_NAME#v}" dist

      # gh is preinstalled on the runner: no package is downloaded here.
      # Create only when missing, so re-running a failed job is safe;
      # the upload always runs and replaces the assets.
      - name: Create release and upload installer
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/install.sh dist/SHA256SUMS --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
