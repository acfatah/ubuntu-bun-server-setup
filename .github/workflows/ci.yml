name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Bumped by hand; Dependabot only updates `uses:` lines
      SHELLCHECK_VERSION: v0.10.0
      SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
      SHFMT_VERSION: v3.8.0
      SHFMT_SHA256: 27b3c6f9d9592fc5b4856c341d1ff2c88856709b9e76469313642a1d7b558fe0
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck, shfmt and actionlint
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir -p bin
          shellcheck_tar="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          shfmt_bin="shfmt_${SHFMT_VERSION}_linux_amd64"
          actionlint_tar="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${shellcheck_tar}"
          curl -fsSLO "https://github.com/mvdan/sh/releases/download/${SHFMT_VERSION}/${shfmt_bin}"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint_tar}"
          sha256sum -c - <<SUMS
          ${SHELLCHECK_SHA256}  ${shellcheck_tar}
          ${SHFMT_SHA256}  ${shfmt_bin}
          ${ACTIONLINT_SHA256}  ${actionlint_tar}
          SUMS
          tar -xJf "$shellcheck_tar" --strip-components=1 -C bin "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          install -m 0755 "$shfmt_bin" bin/shfmt
          tar -xzf "$actionlint_tar" -C bin actionlint
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Tool versions
        run: |
          command -v shellcheck shfmt actionlint
          shellcheck --version
          shfmt --version
          actionlint -version

      - name: shellcheck
        run: make lint

      - name: shfmt
        run: make format-check

      - name: actionlint
        run: make lint-actions

      - name: release.sh tests
        run: make test-release
